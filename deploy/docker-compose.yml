# Production Docker Compose for Cosmic Adventure Backend
# Place this file on your server at /srv/cosmic-adventure/docker-compose.yml

services:
  backend:
    image: ghcr.io/boostcampwm2025/ios05-cosmic-adventure/backend:latest
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - LOG_LEVEL=info
      - SQLITE_PATH=/app/data/db.sqlite
    expose:
      - "8080"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend


