name: Deploy to TestFlight

on:
  push:
    tags:
      - 'ios-v*'

jobs:
  deploy:
    name: Build and Upload to TestFlight
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Install Tuist
        run: mise install tuist

      - name: Verify Tuist Version
        run: mise exec -- tuist version

      - name: Create Environment.xcconfig
        run: echo "${{ secrets.XCCONFIG_CONTENT }}" > iOS/App/Environment.xcconfig

      - name: Install Ruby Dependencies
        run: bundle install

      - name: Setup Keychain for Match
        run: |
          security create-keychain -p actions temp.keychain-db
          security default-keychain -s temp.keychain-db
          security unlock-keychain -p actions temp.keychain-db
          security set-keychain-settings -lut 21600 temp.keychain-db
          security list-keychains -d user -s temp.keychain-db login.keychain-db

      - name: Decode App Store Connect API Key
        run: |
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}" | base64 --decode > fastlane/AuthKey.p8
          chmod 600 fastlane/AuthKey.p8

      - name: Build and Upload to TestFlight
        run: bundle exec fastlane upload_testflight
        env:
          # Match 관련 환경변수
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_KEYCHAIN_NAME: temp.keychain-db
          MATCH_KEYCHAIN_PASSWORD: actions
          # Team ID
          COSMIC_TEAM_ID: ${{ secrets.COSMIC_TEAM_ID }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "30"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          # App Store Connect API Key
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain temp.keychain-db || true
          rm -f fastlane/AuthKey.p8 || true
