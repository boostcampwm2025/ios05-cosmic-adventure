name: Deploy Backend

on:
  push:
    branches: [develop]
    tags:
      - 'v*'
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
      - 'deploy/**'
  pull_request:
    branches: [develop]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
      - 'deploy/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            
            mkdir -p /srv/cosmic-adventure/data
            cd /srv/cosmic-adventure
            
            curl -fsSL https://raw.githubusercontent.com/boostcampwm2025/ios05-cosmic-adventure/develop/deploy/docker-compose.yml -o docker-compose.yml
            curl -fsSL https://raw.githubusercontent.com/boostcampwm2025/ios05-cosmic-adventure/develop/deploy/nginx.conf -o nginx.conf
            
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
